name: API Genesis 1 temporary validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-genesis-1:
    name: API Genesis 1 · extraction validation
    if: github.head_ref == 'api-genesis-1-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate ApiBiblia and prepare Genesis 1 metadata
        env:
          APIBIBLIA_API_KEY: ${{ secrets.APIBIBLIA_API_KEY }}
        run: |
          python tools/bible_extractor/extractor.py \
            --book "Genesis" \
            --chapter "1" \
            --version RVR1960 \
            --output build/extraction-report.json \
            --candidates-output build/question-candidates.json

      - name: Validate extraction metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/extraction-report.json').read_text(encoding='utf-8'))
          candidates = json.loads(Path('build/question-candidates.json').read_text(encoding='utf-8'))
          assert report.get('source') == 'ApiBiblia'
          assert report.get('version_requested') == 'RVR1960'
          assert report.get('verse_processing', {}).get('verses_prepared_in_memory') == 31
          assert report.get('scripture_text_persisted') is False
          assert candidates.get('book') == 'Genesis'
          assert candidates.get('chapter') == 1
          assert candidates.get('verse_count') == 31
          assert all(item.get('source_text_persisted') is False for item in candidates.get('items', []))
          print('ApiBiblia Genesis 1: OK')
          print('verses_prepared: 31')
          print('scripture_text_persisted: false')
          PY

      - name: Upload Genesis 1 extraction metadata
        uses: actions/upload-artifact@v4
        with:
          name: apibiblia-rvr1960-Genesis-1-validation
          path: |
            build/extraction-report.json
            build/question-candidates.json
          retention-days: 1
