name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-1:
    name: Phase 1 · static integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repository, HTML, links, SEO and sitemap
        run: python scripts/quality_check.py
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './build/*' -not -path './dist/*' -not -path './.gradle/*' -not -path './.idea/*' -not -path './.kotlin/*' -print0)
          if ((${#files[@]} == 0)); then echo 'No JavaScript files found.'; exit 0; fi
          for file in "${files[@]}"; do echo "Checking ${file}"; node --check "${file}"; done

  phase-2:
    name: Phase 2 · browser smoke and responsive
    needs: phase-1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Responsive browser smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/neuronova-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            cat /tmp/neuronova-http.log
            echo 'Local test server did not become ready.'
            exit 1
          fi
          npm run test:smoke
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-smoke-failures
          path: artifacts/smoke/
          if-no-files-found: ignore
          retention-days: 5

  phase-3:
    name: Phase 3 · accessibility and functional flows
    needs: phase-2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Accessibility and functional checks
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/neuronova-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then cat /tmp/neuronova-http.log; exit 1; fi
          npm run test:phase3
      - name: Upload phase 3 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-diagnostics
          path: artifacts/phase3/
          if-no-files-found: ignore
          retention-days: 5

  phase-4:
    name: Phase 4 · performance security and resilience
    needs: phase-3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Performance, security and resilience checks
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/neuronova-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then cat /tmp/neuronova-http.log; exit 1; fi
          npm run test:phase4
      - name: Upload phase 4 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-diagnostics
          path: artifacts/phase4/
          if-no-files-found: ignore
          retention-days: 5
