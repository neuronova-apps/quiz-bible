name: Auditar banco maestro contra RVR1960

on:
  push:
    branches: [rvr1960-audit, main, audit-genesis-full-rvr1960]
    paths:
      - "tools/bible_extractor/genesis-master-input.json"
      - "tools/bible_extractor/exodus-master-input.json"
      - "tools/bible_extractor/leviticus-master-input.json"
      - "tools/bible_extractor/numbers-master-input.json"
      - "tools/bible_extractor/deuteronomy-master-input.json"
      - "tools/bible_extractor/joshua-master-input.json"
      - "tools/bible_extractor/audit-input.json"
      - "tools/bible_extractor/auditor.py"
      - "tools/bible_extractor/report_audit.py"
      - "tools/bible_extractor/test_auditor.py"
      - ".github/workflows/audit-rvr1960.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/bible_extractor/genesis-master-input.json"
      - "tools/bible_extractor/exodus-master-input.json"
      - "tools/bible_extractor/leviticus-master-input.json"
      - "tools/bible_extractor/numbers-master-input.json"
      - "tools/bible_extractor/deuteronomy-master-input.json"
      - "tools/bible_extractor/joshua-master-input.json"
      - "tools/bible_extractor/audit-input.json"
      - "tools/bible_extractor/auditor.py"
      - "tools/bible_extractor/report_audit.py"
      - "tools/bible_extractor/test_auditor.py"
      - ".github/workflows/audit-rvr1960.yml"
  workflow_dispatch:
    inputs:
      input_file:
        description: "Ruta del archivo de entrada de preguntas"
        required: true
        default: "tools/bible_extractor/joshua-master-input.json"
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Auditoría textual derivada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas unitarias de auditoría
        run: |
          python tools/bible_extractor/test_auditor.py

      - name: Determinar archivo de entrada y destino
        id: select_input
        run: |
          INPUT_FILE="${{ inputs.input_file || '' }}"
          if [ -z "$INPUT_FILE" ]; then
            if [ -f "tools/bible_extractor/joshua-master-input.json" ]; then
              INPUT_FILE="tools/bible_extractor/joshua-master-input.json"
            elif [ -f "tools/bible_extractor/deuteronomy-master-input.json" ]; then
              INPUT_FILE="tools/bible_extractor/deuteronomy-master-input.json"
            elif [ -f "tools/bible_extractor/numbers-master-input.json" ]; then
              INPUT_FILE="tools/bible_extractor/numbers-master-input.json"
            elif [ -f "tools/bible_extractor/leviticus-master-input.json" ]; then
              INPUT_FILE="tools/bible_extractor/leviticus-master-input.json"
            elif [ -f "tools/bible_extractor/exodus-master-input.json" ]; then
              INPUT_FILE="tools/bible_extractor/exodus-master-input.json"
            elif [ -f "tools/bible_extractor/genesis-master-input.json" ]; then
              INPUT_FILE="tools/bible_extractor/genesis-master-input.json"
            elif [ -f "tools/bible_extractor/audit-input.json" ]; then
              INPUT_FILE="tools/bible_extractor/audit-input.json"
            else
              echo "No se encontró archivo de entrada de auditoría."
              exit 1
            fi
          fi

          if [[ "$INPUT_FILE" == *"joshua"* ]] || [[ "$INPUT_FILE" == *"josue"* ]]; then
            OUTPUT_DIR="build/audit/joshua"
            ARTIFACT_NAME="auditoria-josue-rvr1960-${{ github.run_number }}"
          elif [[ "$INPUT_FILE" == *"deuteronomy"* ]] || [[ "$INPUT_FILE" == *"deuteronomio"* ]]; then
            OUTPUT_DIR="build/audit/deuteronomy"
            ARTIFACT_NAME="auditoria-deuteronomio-rvr1960-${{ github.run_number }}"
          elif [[ "$INPUT_FILE" == *"numbers"* ]] || [[ "$INPUT_FILE" == *"numeros"* ]]; then
            OUTPUT_DIR="build/audit/numbers"
            ARTIFACT_NAME="auditoria-numeros-rvr1960-${{ github.run_number }}"
          elif [[ "$INPUT_FILE" == *"leviticus"* ]] || [[ "$INPUT_FILE" == *"levitico"* ]]; then
            OUTPUT_DIR="build/audit/leviticus"
            ARTIFACT_NAME="auditoria-levitico-rvr1960-${{ github.run_number }}"
          elif [[ "$INPUT_FILE" == *"exodus"* ]] || [[ "$INPUT_FILE" == *"exodo"* ]]; then
            OUTPUT_DIR="build/audit/exodus"
            ARTIFACT_NAME="auditoria-exodo-rvr1960-${{ github.run_number }}"
          else
            OUTPUT_DIR="build/audit/genesis"
            ARTIFACT_NAME="auditoria-genesis-rvr1960-${{ github.run_number }}"
          fi

          echo "selected_file=$INPUT_FILE" >> $GITHUB_OUTPUT
          echo "output_dir=$OUTPUT_DIR" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Archivo seleccionado: $INPUT_FILE -> Salida: $OUTPUT_DIR"

      - name: Auditar preguntas con ApiBiblia RVR1960
        env:
          APIBIBLIA_API_KEY: ${{ secrets.APIBIBLIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python tools/bible_extractor/auditor.py \
            --input "${{ steps.select_input.outputs.selected_file }}" \
            --output-dir "${{ steps.select_input.outputs.output_dir }}"

      - name: Validar que no se persiste texto bíblico
        env:
          TARGET_DIR: ${{ steps.select_input.outputs.output_dir }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          
          out_dir = Path(os.environ.get('TARGET_DIR', 'build/audit/genesis'))
          json_files = list(out_dir.glob('*.json'))
          assert len(json_files) > 0, "No se generaron archivos derivados de auditoría."
          
          for jf in json_files:
              data = json.loads(jf.read_text(encoding='utf-8'))
              print(f"Validando {jf.name}...")
              assert data.get('source_text_persisted') is False, f"source_text_persisted no es False en {jf.name}"
              
              # Validar recursivamente que no existan campos 'text' ni 'verse_text' con contenido bíblico
              def assert_no_scripture(node):
                  if isinstance(node, dict):
                      assert 'text' not in node and 'verse_text' not in node, f"Campo de texto bíblico encontrado en {jf.name}"
                      for v in node.values():
                          assert_no_scripture(v)
                  elif isinstance(node, list):
                      for item in node:
                          assert_no_scripture(item)
              
              assert_no_scripture(data)
          PY

      - name: Generar informe oficial de auditoría
        run: |
          python tools/bible_extractor/report_audit.py \
            --output-dir "${{ steps.select_input.outputs.output_dir }}" \
            --master-input "${{ steps.select_input.outputs.selected_file }}"

      - name: Publicar resultados derivados
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.select_input.outputs.artifact_name }}
          path: ${{ steps.select_input.outputs.output_dir }}/
          retention-days: 7
