name: Auditar banco maestro contra RVR1960

on:
  push:
    branches: [rvr1960-audit, main, audit-genesis-full-rvr1960]
    paths:
      - "tools/bible_extractor/genesis-master-input.json"
      - "tools/bible_extractor/audit-input.json"
      - "tools/bible_extractor/auditor.py"
      - ".github/workflows/audit-rvr1960.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/bible_extractor/genesis-master-input.json"
      - "tools/bible_extractor/audit-input.json"
      - "tools/bible_extractor/auditor.py"
      - ".github/workflows/audit-rvr1960.yml"
  workflow_dispatch:
    inputs:
      input_file:
        description: "Ruta del archivo de entrada de preguntas"
        required: true
        default: "tools/bible_extractor/genesis-master-input.json"
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Auditoría textual derivada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas unitarias de auditoría
        run: |
          python tools/bible_extractor/test_auditor.py

      - name: Determinar archivo de entrada
        id: select_input
        run: |
          INPUT_FILE="${{ inputs.input_file || 'tools/bible_extractor/genesis-master-input.json' }}"
          if [ ! -f "$INPUT_FILE" ]; then
            if [ -f "tools/bible_extractor/audit-input.json" ]; then
              INPUT_FILE="tools/bible_extractor/audit-input.json"
            else
              echo "No se encontró archivo de entrada de auditoría."
              exit 1
            fi
          fi
          echo "selected_file=$INPUT_FILE" >> $GITHUB_OUTPUT
          echo "Archivo seleccionado: $INPUT_FILE"

      - name: Auditar preguntas con ApiBiblia RVR1960
        env:
          APIBIBLIA_API_KEY: ${{ secrets.APIBIBLIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python tools/bible_extractor/auditor.py \
            --input "${{ steps.select_input.outputs.selected_file }}" \
            --output-dir build/audit/genesis

      - name: Validar que no se persiste texto bíblico
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          
          out_dir = Path('build/audit/genesis')
          json_files = list(out_dir.glob('*.json'))
          assert len(json_files) > 0, "No se generaron archivos derivados de auditoría."
          
          for jf in json_files:
              data = json.loads(jf.read_text(encoding='utf-8'))
              print(f"Validando {jf.name}...")
              assert data.get('source_text_persisted') is False, f"source_text_persisted no es False en {jf.name}"
              
              # Validar recursivamente que no existan campos 'text' ni 'verse_text' con contenido bíblico
              def assert_no_scripture(node):
                  if isinstance(node, dict):
                      assert 'text' not in node and 'verse_text' not in node, f"Campo de texto bíblico encontrado en {jf.name}"
                      for v in node.values():
                          assert_no_scripture(v)
                  elif isinstance(node, list):
                      for item in node:
                          assert_no_scripture(item)
              
              assert_no_scripture(data)
          
          summary = json.loads((out_dir / 'resumen-general.json').read_text(encoding='utf-8'))
          print('\n==================== RESUMEN GENERAL AUDITORÍA ====================')
          print('Total preguntas:', summary.get('total_questions'))
          print('Capítulos cubiertos:', summary.get('chapters_covered'))
          print('VERIFICADO:', summary.get('verified_count'))
          print('REQUIERE_CORRECCION:', summary.get('requires_correction_count'))
          print('NO_CONCLUYENTE:', summary.get('inconclusive_count'))
          print('source_text_persisted:', summary.get('source_text_persisted'))
          
          print('\n--- Distribución de los 17 Controles ---')
          ctrl_dist = summary.get('controls_distribution', {})
          for ctrl_name, counts in ctrl_dist.items():
              print(f"  {ctrl_name:<32}: PASS={counts.get('PASS', 0):<3} FAIL={counts.get('FAIL', 0):<3} UNKNOWN={counts.get('UNKNOWN', 0):<3} NOT_APPLICABLE={counts.get('NOT_APPLICABLE', 0):<3}")
          
          revision_file = out_dir / 'revision-manual-pendiente.json'
          if revision_file.exists():
              rev_data = json.loads(revision_file.read_text(encoding='utf-8'))
              print(f"\n--- Casos Pendientes de Revisión Manual ({rev_data.get('total_pendientes', 0)}) ---")
              for item in rev_data.get('pendientes', [])[:10]:
                  print(f"  [{item.get('id')}] {item.get('reference')} -> {item.get('estado')}: {item.get('incidencias')}")
          print('====================================================================\n')
          PY

      - name: Publicar resultados derivados
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-genesis-rvr1960-${{ github.run_number }}
          path: build/audit/genesis/
          retention-days: 7
